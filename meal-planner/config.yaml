# --- 献立生成ルール ---
rules:
  max_same_main_per_week: 1
  avoid_consecutive_same_protein: true
  weekday_max_total_time_minutes: 30
  min_fish_per_week: 1
  prefer_seasonal: true

# --- Googleカレンダー設定 ---
google_calendar:
  calendar_id: "primary"
  credentials_file: "credentials.json"
  token_file: "token.json"
  dinner_time: "18:00"
  event_duration_minutes: 60
  event_color_id: "6"
