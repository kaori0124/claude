# ============================================================
# 献立プランナー設定ファイル
# ============================================================

# --- 家族情報 ---
family:
  members: ["自分", "夫", "娘(11歳)"]

# --- 食事の設定 ---
meals:
  # 対象: 平日（月〜金）の晩ごはんのみ
  days: 5
  # 構成: メイン + サラダ（必須）+ 副菜（できれば）
  # 白米なし、丼もの・麺類はOK

# --- 料理データベース ---
# category: main / salad / side
# effort: easy / normal
# time_minutes: 調理時間（分）。0 = 買ってくるだけ
# seasons: 旬の季節 (spring/summer/autumn/winter)。省略 = 通年
# recipe_url: レシピのURL。カレンダーの詳細からタップで開ける。省略OK
dishes:

  # =========================================
  #  メイン：自分で作るもの
  # =========================================
  - name: "チンジャオロース"
    category: "main"
    effort: "easy"
    time_minutes: 15
    tags: ["中華"]
    recipe_url: ""  # ← ここにレシピURLを貼る
    ingredients:
      - { name: "牛肉（細切り用）", amount: "250g", section: "肉" }
      - { name: "ピーマン", amount: "4個", section: "野菜" }
      - { name: "たけのこ水煮", amount: "1袋", section: "野菜" }

  - name: "肉じゃが"
    category: "main"
    effort: "normal"
    time_minutes: 25
    tags: ["和食", "定番"]
    ingredients:
      - { name: "豚バラ薄切り", amount: "250g", section: "肉" }
      - { name: "じゃがいも", amount: "3個", section: "野菜" }
      - { name: "にんじん", amount: "1本", section: "野菜" }
      - { name: "玉ねぎ", amount: "1個", section: "野菜" }
      - { name: "しらたき", amount: "1袋", section: "その他" }

  - name: "オムレツ（じゃがいもウィンナー）"
    category: "main"
    effort: "easy"
    time_minutes: 20
    tags: ["洋食"]
    ingredients:
      - { name: "卵", amount: "6個", section: "卵・乳製品" }
      - { name: "じゃがいも", amount: "2個", section: "野菜" }
      - { name: "ウィンナー", amount: "1袋", section: "肉加工品" }
      - { name: "ピザ用チーズ", amount: "適量", section: "卵・乳製品" }

  - name: "唐揚げ（一枚揚げ）"
    category: "main"
    effort: "normal"
    time_minutes: 25
    tags: ["定番"]
    ingredients:
      - { name: "鶏もも肉", amount: "2枚(500g)", section: "肉" }
      - { name: "しょうが", amount: "1かけ", section: "野菜" }
      - { name: "にんにく", amount: "1かけ", section: "野菜" }
      - { name: "片栗粉", amount: "適量", section: "乾物" }

  - name: "鮭のホイル焼き"
    category: "main"
    effort: "easy"
    time_minutes: 20
    tags: ["魚", "ヘルシー"]
    seasons: ["autumn", "winter"]
    ingredients:
      - { name: "鮭切り身", amount: "3切れ", section: "魚" }
      - { name: "えのき", amount: "1袋", section: "野菜" }
      - { name: "玉ねぎ", amount: "1/2個", section: "野菜" }
      - { name: "バター", amount: "適量", section: "卵・乳製品" }

  - name: "牛丼"
    category: "main"
    effort: "easy"
    time_minutes: 15
    tags: ["丼もの", "定番"]
    ingredients:
      - { name: "牛こま切れ", amount: "300g", section: "肉" }
      - { name: "玉ねぎ", amount: "1個", section: "野菜" }

  - name: "鍋"
    category: "main"
    effort: "easy"
    time_minutes: 15
    tags: ["定番"]
    seasons: ["autumn", "winter"]
    ingredients:
      - { name: "鍋用カット野菜", amount: "1袋", section: "野菜" }
      - { name: "豚バラ薄切り", amount: "300g", section: "肉" }
      - { name: "豆腐", amount: "1丁", section: "豆腐" }
      - { name: "鍋つゆ", amount: "1袋", section: "調味料" }

  # =========================================
  #  メイン：市販の素を使うもの
  # =========================================
  - name: "麻婆豆腐"
    category: "main"
    effort: "easy"
    time_minutes: 15
    tags: ["中華", "市販の素"]
    ingredients:
      - { name: "豚ひき肉", amount: "200g", section: "肉" }
      - { name: "豆腐", amount: "2丁", section: "豆腐" }
      - { name: "麻婆豆腐の素", amount: "1箱", section: "調味料" }

  - name: "カレー"
    category: "main"
    effort: "easy"
    time_minutes: 25
    tags: ["定番", "市販の素"]
    ingredients:
      - { name: "豚肉（カレー用）", amount: "300g", section: "肉" }
      - { name: "じゃがいも", amount: "2個", section: "野菜" }
      - { name: "にんじん", amount: "1本", section: "野菜" }
      - { name: "玉ねぎ", amount: "2個", section: "野菜" }
      - { name: "カレールー", amount: "1箱", section: "調味料" }

  - name: "ハヤシライス"
    category: "main"
    effort: "easy"
    time_minutes: 20
    tags: ["洋食", "市販の素"]
    ingredients:
      - { name: "牛こま切れ", amount: "300g", section: "肉" }
      - { name: "玉ねぎ", amount: "2個", section: "野菜" }
      - { name: "マッシュルーム", amount: "1パック", section: "野菜" }
      - { name: "ハヤシライスルー", amount: "1箱", section: "調味料" }

  - name: "タッカルビ"
    category: "main"
    effort: "easy"
    time_minutes: 20
    tags: ["韓国", "市販の素"]
    ingredients:
      - { name: "鶏もも肉", amount: "300g", section: "肉" }
      - { name: "キャベツ", amount: "1/4個", section: "野菜" }
      - { name: "玉ねぎ", amount: "1個", section: "野菜" }
      - { name: "ピザ用チーズ", amount: "適量", section: "卵・乳製品" }
      - { name: "タッカルビの素", amount: "1袋", section: "調味料" }

  - name: "トッポギ"
    category: "main"
    effort: "easy"
    time_minutes: 15
    tags: ["韓国", "市販の素"]
    ingredients:
      - { name: "トッポギセット（餅+ソース）", amount: "1袋", section: "その他" }
      - { name: "ウィンナー", amount: "1袋", section: "肉加工品" }
      - { name: "ゆで卵", amount: "3個", section: "卵・乳製品" }

  # =========================================
  #  メイン：お惣菜（買ってくるだけ）
  # =========================================
  - name: "チキンカツ"
    category: "main"
    effort: "easy"
    time_minutes: 0
    tags: ["お惣菜"]
    ingredients:
      - { name: "チキンカツ", amount: "3枚", section: "お惣菜" }

  - name: "刺身"
    category: "main"
    effort: "easy"
    time_minutes: 0
    tags: ["お惣菜", "魚"]
    ingredients:
      - { name: "刺身盛り合わせ", amount: "1パック", section: "お惣菜" }

  - name: "焼き魚"
    category: "main"
    effort: "easy"
    time_minutes: 0
    tags: ["お惣菜", "魚"]
    ingredients:
      - { name: "焼き魚", amount: "3切れ", section: "お惣菜" }

  - name: "うなぎ"
    category: "main"
    effort: "easy"
    time_minutes: 0
    tags: ["お惣菜", "魚"]
    seasons: ["summer"]
    ingredients:
      - { name: "うなぎ蒲焼き", amount: "2尾", section: "お惣菜" }

  - name: "コロッケ"
    category: "main"
    effort: "easy"
    time_minutes: 0
    tags: ["お惣菜"]
    ingredients:
      - { name: "コロッケ", amount: "6個", section: "お惣菜" }

  - name: "メンチカツ"
    category: "main"
    effort: "easy"
    time_minutes: 0
    tags: ["お惣菜"]
    ingredients:
      - { name: "メンチカツ", amount: "3個", section: "お惣菜" }

  # =========================================
  #  サラダ（毎食必ず1品）
  # =========================================
  - name: "レタスサラダ"
    category: "salad"
    effort: "easy"
    time_minutes: 5
    tags: ["定番"]
    ingredients:
      - { name: "レタス", amount: "1玉", section: "野菜" }
      - { name: "トマト", amount: "2個", section: "野菜" }
      - { name: "きゅうり", amount: "1本", section: "野菜" }
      - { name: "アボカド", amount: "1個", section: "野菜" }

  - name: "もやしのナムル"
    category: "salad"
    effort: "easy"
    time_minutes: 10
    tags: ["韓国"]
    ingredients:
      - { name: "もやし", amount: "1袋", section: "野菜" }
      - { name: "ごま油", amount: "適量", section: "調味料" }

  - name: "キュウリのナムル"
    category: "salad"
    effort: "easy"
    time_minutes: 5
    tags: ["韓国"]
    ingredients:
      - { name: "きゅうり", amount: "3本", section: "野菜" }
      - { name: "ごま油", amount: "適量", section: "調味料" }

  - name: "カプレーゼ"
    category: "salad"
    effort: "easy"
    time_minutes: 5
    tags: ["イタリアン"]
    seasons: ["summer"]
    ingredients:
      - { name: "トマト", amount: "2個", section: "野菜" }
      - { name: "モッツァレラチーズ", amount: "1個", section: "卵・乳製品" }
      - { name: "バジル", amount: "適量", section: "野菜" }
      - { name: "オリーブオイル", amount: "適量", section: "調味料" }

  # --- 旬のサラダ ---
  - name: "大根サラダ"
    category: "salad"
    effort: "easy"
    time_minutes: 5
    tags: ["和風"]
    seasons: ["autumn", "winter"]
    ingredients:
      - { name: "大根", amount: "1/3本", section: "野菜" }
      - { name: "かいわれ大根", amount: "1パック", section: "野菜" }
      - { name: "かつお節", amount: "1パック", section: "乾物" }

  - name: "春キャベツのサラダ"
    category: "salad"
    effort: "easy"
    time_minutes: 5
    tags: ["和風"]
    seasons: ["spring"]
    ingredients:
      - { name: "キャベツ", amount: "1/4個", section: "野菜" }
      - { name: "塩昆布", amount: "適量", section: "乾物" }
      - { name: "ごま油", amount: "適量", section: "調味料" }

  - name: "水菜サラダ"
    category: "salad"
    effort: "easy"
    time_minutes: 5
    tags: ["和風"]
    seasons: ["winter"]
    ingredients:
      - { name: "水菜", amount: "1袋", section: "野菜" }
      - { name: "ツナ缶", amount: "1缶", section: "缶詰" }

  # =========================================
  #  副菜（時間に余裕があれば）
  # =========================================
  - name: "フライドポテト"
    category: "side"
    effort: "easy"
    time_minutes: 10
    tags: ["市販の素"]
    ingredients:
      - { name: "冷凍フライドポテト", amount: "1袋", section: "冷凍食品" }

  - name: "ポテトサラダ"
    category: "side"
    effort: "easy"
    time_minutes: 0
    tags: ["お惣菜"]
    ingredients:
      - { name: "ポテトサラダ", amount: "1パック", section: "お惣菜" }

  - name: "マカロニサラダ"
    category: "side"
    effort: "easy"
    time_minutes: 0
    tags: ["お惣菜"]
    ingredients:
      - { name: "マカロニサラダ", amount: "1パック", section: "お惣菜" }

  - name: "キムチ"
    category: "side"
    effort: "easy"
    time_minutes: 0
    tags: ["韓国", "お惣菜"]
    ingredients:
      - { name: "キムチ", amount: "1パック", section: "お惣菜" }

  # --- 旬の副菜 ---
  - name: "枝豆"
    category: "side"
    effort: "easy"
    time_minutes: 5
    tags: ["おつまみ"]
    seasons: ["summer"]
    ingredients:
      - { name: "枝豆（冷凍可）", amount: "1袋", section: "冷凍食品" }

  - name: "きのこソテー"
    category: "side"
    effort: "easy"
    time_minutes: 10
    tags: ["洋食"]
    seasons: ["autumn"]
    ingredients:
      - { name: "しめじ", amount: "1パック", section: "野菜" }
      - { name: "エリンギ", amount: "1パック", section: "野菜" }
      - { name: "バター", amount: "適量", section: "卵・乳製品" }

  - name: "さつまいもの甘煮"
    category: "side"
    effort: "easy"
    time_minutes: 15
    tags: ["和食"]
    seasons: ["autumn", "winter"]
    ingredients:
      - { name: "さつまいも", amount: "1本", section: "野菜" }

  - name: "ほうれん草のごまあえ"
    category: "side"
    effort: "easy"
    time_minutes: 10
    tags: ["和食"]
    seasons: ["winter"]
    ingredients:
      - { name: "ほうれん草", amount: "1束", section: "野菜" }
      - { name: "すりごま", amount: "適量", section: "乾物" }

  - name: "冷やしトマト"
    category: "side"
    effort: "easy"
    time_minutes: 0
    tags: ["簡単"]
    seasons: ["summer"]
    ingredients:
      - { name: "トマト", amount: "2個", section: "野菜" }

# --- 参照レシピサイト ---
# 各料理の recipe_url にレシピを貼るときの参照先
recipe_sites:
  - name: "クックパッド"
    url: "https://cookpad.com/jp"
  - name: "クラシル"
    url: "https://www.kurashiru.com/"
  - name: "つきの家族食堂"
    url: "https://ameblo.jp/mamagohann/"

# --- 献立生成ルール ---
rules:
  max_same_main_per_week: 1
  avoid_consecutive_same_protein: true
  weekday_max_total_time_minutes: 30
  min_fish_per_week: 1
  prefer_seasonal: true

# --- Googleカレンダー設定 ---
google_calendar:
  calendar_id: "primary"
  credentials_file: "credentials.json"
  token_file: "token.json"
  dinner_time: "18:00"
  event_duration_minutes: 60
  event_color_id: "6"
