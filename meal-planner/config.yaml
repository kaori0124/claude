# effort: easy / normal
# time_minutes: 調理時間（分）。0 = 買ってくるだけ
# seasons: 旬の季節 (spring/summer/autumn/winter)。省略 = 通年
# recipe_url: レシピのURL。カレンダーの詳細からタップで開ける。省略OK
